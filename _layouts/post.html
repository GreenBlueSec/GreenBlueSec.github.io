---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.area %}<span class="post-area">{{ page.area }}</span>{% endif %}
    </div>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a class="btn back-link" href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a>
  </footer>
</article>
